function hwfx(){let e=document.getElementById('hwfx');if(S.th!='hw'){if(e)e.remove();return}if(e)return;e=document.createElement('div');e.id='hwfx';const r=(a,b)=>(a+Math.random()*(b-a)).toFixed(1);let h=WEB.replace('<svg','<svg style="left:0"')+WEB.replace('<svg','<svg style="right:0;transform:scaleX(-1)"');
