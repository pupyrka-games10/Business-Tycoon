<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Tycoon</title>
<meta name="theme-color" content="#00b863">
<meta name="description" content="Business Tycoon — кликер-симулятор бизнеса">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tycoon">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#00b863;--g2:#009c55;--bg:#f3f5f7;--ink:#1a1a22;--mute:#8a93a0;--navy:#22263a;--line:#e3e7ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Roboto Slab',Georgia,serif;display:flex;flex-direction:column;max-width:520px;margin:0 auto;transition:background .3s}
body.earn{background:linear-gradient(#1e8f6c,#7fd1b9);color:#fff}
main{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 20px}main.e{display:flex;flex-direction:column;overflow:hidden;padding:8px 14px 12px}
h1{font-size:34px;margin:6px 2px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:900}
.pill{font-size:13px;font-weight:700;background:#e5f8ee;color:#00803f;border-radius:20px;padding:7px 12px}
h2{font-size:22px;margin:18px 2px 10px;display:flex;justify-content:space-between;font-weight:900}h2 span{font-size:15px;color:var(--mute);font-weight:700}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);position:relative}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:10px 0 9px;font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button span{font-size:21px;filter:grayscale(1);opacity:.7}nav .on{color:var(--g)}nav .on span{filter:none;opacity:1}
nav .mid span{width:62px;height:62px;margin-top:-34px;border-radius:50%;background:#e3f8ed;border:5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px;filter:none;opacity:1;box-shadow:0 6px 14px #0002}
nav .mid.on span{background:var(--g)}
.news{display:flex;gap:10px;align-items:center;background:#fff1f1;border:1.5px solid #ef5a5a;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.news small{display:block;color:var(--mute);font-weight:700;font-size:12px}.news b{font-size:16px}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;text-align:center;border-radius:24px;padding:22px 10px;margin-bottom:12px}
.hero small{display:block;opacity:.85;font-size:15px}.hero b{font-size:34px;font-weight:900}
.bar{height:7px;background:#0002;border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:4px}
.biz{display:flex;gap:14px;align-items:center;border-radius:22px;padding:14px;margin-bottom:12px;border:1.5px solid;width:100%;text-align:left;font:inherit}
.biz .ic,.ic{font-size:30px;width:58px;height:58px;border-radius:50%;background:#0002;display:flex;align-items:center;justify-content:center;flex:none}
.inf{flex:1;min-width:0}.inf b{display:block;font-size:19px;font-weight:900}.inf span{font-size:14px;opacity:.75;display:block}.inf em{font-style:normal;font-weight:700;font-size:15px}
.w{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn{border:0;border-radius:16px;padding:12px 16px;font:inherit;font-weight:900;font-size:15px;background:var(--g);color:#fff}
.btn:disabled{background:#d5dae0;color:#fff}.btn.s{padding:9px 14px;font-size:14px;display:block;width:100%;margin:3px 0}.btn.r{background:#ef5a5a}
.btn small{display:block;font-weight:700;opacity:.9;font-size:12px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;display:flex;gap:14px;align-items:center}
.card .ic{background:#f1f3f5}.card .inf span{color:var(--mute);opacity:1}
.lux{display:flex;gap:8px;margin-bottom:12px}.lux button{flex:1;border:0;border-radius:20px;padding:34px 6px 10px;font:inherit;color:#fff;font-weight:900;font-size:15px;position:relative;text-shadow:0 1px 4px #0008}
.lux button:disabled{filter:grayscale(.8) brightness(.8)}.lux button i{position:absolute;top:8px;left:0;right:0;font-size:32px;font-style:normal}.lux small{display:block;font-size:11px;font-weight:700}
.biz{flex-wrap:wrap}.bb{display:flex;gap:6px;margin-top:10px;width:100%}.bb .btn{flex:1;padding:8px 4px;font-size:12.5px}.bb .btn small{font-size:11px}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{flex:1;border:0;border-radius:14px;padding:10px;font:inherit;font-weight:900;background:#e5e9ee;color:var(--mute)}.seg .on{background:var(--ink);color:#fff}
.skg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.skc{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:10px;text-align:center}.sk{height:84px;border-radius:14px;padding:10px;margin-bottom:8px;text-align:left}
#sheet .bd{position:fixed;inset:0;background:#0007;z-index:20}#sheet .sh{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;max-height:82%;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));z-index:21;color:var(--ink)}
.cat{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:14px;text-align:left;font:inherit;color:var(--ink)}.cat.d{opacity:.45}.cat .ic{margin-bottom:8px;background:#f1f3f5}.cat b{display:block;font-size:16px}.cat span{display:block;color:var(--mute);font-size:13px}.cat small{color:var(--g);font-weight:700;font-size:12px}.x{border:0;background:none;font-size:22px;color:var(--mute)}
.tmr{text-align:center;font-weight:900;font-size:15px;min-width:58px}.tmr small{display:block;font-size:11px;opacity:.7;font-weight:400}
input{user-select:text;-webkit-user-select:text}.art{position:absolute;inset:0;width:100%;height:100%}.cardb>*:not(.art){position:relative;z-index:1}.cardb:after{display:none}.cn{display:flex;justify-content:space-between;font-family:monospace;color:#e6cf86;font-size:15px;letter-spacing:1px;text-shadow:0 1px 3px #000a}.sk{position:relative;overflow:hidden;height:92px}
.sk .cn{position:absolute;left:0;right:0;top:0;padding:10px 14px;z-index:1;font-size:13px}
#ad{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;color:#fff}.adtop{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0}
.adbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}.adbody .em{font-size:110px;animation:bn 1s ease-in-out infinite alternate}.adbody h3{font-size:32px;margin:0;font-weight:900}.adbody p{font-size:18px;margin:0}
.adbot{padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}@keyframes bn{to{transform:translateY(-16px) scale(1.08)}}
.ae{font-size:120px;line-height:1}.a-zoom{animation:zm 3.5s ease-out both}.a-spin{animation:sp 3.5s ease-out both}.a-slide{animation:sl 3.5s ease-out both}.a-pop{animation:pp 3.5s both}
@keyframes zm{0%{transform:scale(.2) rotate(-20deg);opacity:0}15%{transform:scale(1.3);opacity:1}25%{transform:scale(1)}100%{transform:scale(1.1)}}
@keyframes sp{0%{transform:rotate(-540deg) scale(.1)}30%{transform:rotate(0) scale(1.15)}100%{transform:rotate(8deg) scale(1)}}
@keyframes sl{0%{transform:translateX(120vw)}20%{transform:translateX(0)}100%{transform:translateX(-14px)}}
@keyframes pp{0%{transform:scale(0)}12%{transform:scale(1.35)}20%{transform:scale(.95)}30%,100%{transform:scale(1)}}
.tx{animation:txi .7s .25s both}@keyframes txi{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.cta{background:#fff!important;color:#222!important;padding:14px 30px!important;animation:cp 1s infinite alternate}@keyframes cp{to{transform:scale(1.1)}}
.pt{position:absolute;top:-10%;pointer-events:none;opacity:.7;animation:fall linear infinite}@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
#ad{overflow:hidden;animation:bgs 6s ease infinite alternate}@keyframes bgs{to{background-position:100% 100%}}.adtop,.adbody,.adbot{position:relative;z-index:1}
.brand{font-size:30px;font-weight:900;padding:8px 22px;border-radius:16px;background:#0005;border:2px solid #fff8;animation:pp 1s .4s both;max-width:92%;word-break:break-word}
.up{color:var(--g)}.dn{color:#ef5a5a}
.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.top .p{background:#fff3;border-radius:22px;padding:11px 14px;font-weight:900;font-size:15px}
.cardb{background:var(--navy);border-radius:26px;padding:14px 18px;position:relative;overflow:hidden;margin-bottom:8px;box-shadow:0 8px 20px #0004}
.cardb:after{content:"";position:absolute;right:-60px;top:-30px;width:220px;height:220px;border-radius:50%;border:1px solid #fff2}
.chip{width:46px;height:34px;border-radius:7px;background:#d6b84f}
.cardb small{color:#9aa0b4;font-size:17px;display:block;margin-top:10px}.cardb b{font-size:38px;font-weight:900;letter-spacing:-1px}
.tapv{background:#0003;border-radius:16px;padding:10px 16px;font-size:18px;font-weight:900;margin-bottom:8px}.tapv span{opacity:.7;font-size:16px;font-weight:400}
#tap{flex:1;min-height:110px;border-radius:28px;background:#fff2;border:2px solid #fff4;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;touch-action:manipulation;transition:transform .06s;text-align:center;font-size:18px}
#tap:active{transform:scale(.98);background:#fff3}#tap div{font-size:52px}
.fl{position:absolute;font-weight:900;font-size:24px;color:#fff;pointer-events:none;animation:up .8s forwards;text-shadow:0 2px 4px #0006}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.boost{width:100%;margin:8px 0;border:0;border-radius:20px;padding:11px;font:inherit;font-weight:900;font-size:20px;color:#fff;background:linear-gradient(90deg,#ff6f00,#ffb300);box-shadow:0 8px 16px #ff8a0044}
.boost:disabled{filter:saturate(.4)}.boost small{display:block;font-size:12px;font-weight:700;opacity:.9}
.two{display:flex;gap:10px}.two .btn{flex:1;background:#fff5;text-align:left;color:#fff}.two .btn:disabled{background:#fff3;color:#fff9}.two .btn:not(:disabled){background:#fff9;color:#1a4a3a}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 20px);transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:9;max-width:90%;text-align:center}
